<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">

    <!-- Firebase config and auth helpers -->
    <script type="module" src="../js/firebase.js"></script>
    <script defer src="../js/auth.js"></script>
    <script defer src="../js/registro.js"></script>
</head>
<body>
    <div class="header">
        <div class="container-custom">
            <h1 class="header-title">Sistema de Reportes</h1>
            <p class="header-subtitle">Crea tu cuenta para comenzar a reportar incidencias desde el mapa.</p>
        </div>
    </div>

    <div class="container-custom">
        <div class="page-card mx-auto" style="max-width: 560px;">
            <h2 class="section-title">Registro</h2>
            <div class="form-card">
                <div class="form-group">
                    <label for="input-mail">Correo electrónico</label>
                    <input type="email" class="form-control" id="input-mail">
                </div>
                <div class="form-group">
                    <label for="input-name">Nombre</label>
                    <input type="text" class="form-control" id="input-name">
                </div>
                <div class="form-group">
                    <label for="input-password">Contraseña</label>
                    <input type="password" class="form-control" id="input-password">
                </div>
                <div class="form-actions">
                    <button id="btn-register" type="button" class="btn btn-primary">Registrarme</button>
                    <a href="login.html" class="btn btn-secondary">Iniciar sesión</a>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2024 Sistema de Reportes. Todos los derechos reservados.</p>
    </div>
</body>
</html>
