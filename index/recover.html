<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>

    <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">

    <script type="module" src="../js/firebase.js"></script>
    <script defer src="../js/auth.js"></script>
    <script defer src="../js/recover.js"></script>
</head>
<body>
    <div class="header">
        <div class="container-custom">
            <h1 class="header-title">Recuperar contraseña</h1>
            <p class="header-subtitle">Ingresa tu correo para recibir un enlace de restablecimiento.</p>
        </div>
    </div>

    <div class="container-custom">
        <div class="page-card mx-auto" style="max-width: 560px;">
            <h2 class="section-title">Recuperación de cuenta</h2>
            <div class="form-card">
                <form id="recover-form">
                    <div class="form-group">
                        <label for="input-mail">Correo electrónico</label>
                        <input type="email" class="form-control" id="input-mail" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Enviar enlace</button>
                    <a href="login.html" class="btn btn-link mt-3">Volver al inicio de sesión</a>
                </form>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2024 Sistema de Reportes. Todos los derechos reservados.</p>
    </div>
</body>
</html>
